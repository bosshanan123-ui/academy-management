<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Academy MS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 600px at 15% 15%, rgba(47, 90, 163, 0.45), transparent 60%),
        linear-gradient(160deg, #0a1729 0%, #10233f 45%, #162e58 75%, #1c3b70 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100vh;
      text-align: center;
    }
    .offline-card {
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
    }
    .offline-emoji {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #244a8b 0%, #34889b 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(36, 74, 139, 0.38);
      transition: transform 0.2s, filter 0.2s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.06); }
    button:active { transform: translateY(0); }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-emoji">📡</div>
    <h1>You're Offline</h1>
    <p>
      No internet connection detected. Please check your network and try again.<br>
      Cached pages may still be available.
    </p>
    <button onclick="window.location.reload()">
      🔄 Try Again
    </button>
  </div>
</body>
</html>
