{% extends "base.html" %}
{% block title %}Login — Academy MS{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <!-- Floating orbs -->
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>
  <div class="orb o3" aria-hidden="true"></div>
  <div class="orb o4" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-logo">🎓</div>
    <h1 class="auth-title">Academy Management</h1>
    <p class="auth-subtitle">Sign in with your Roll Number</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="roll_number">Roll Number</label>
        <input type="text" id="roll_number" name="roll_number"
               placeholder="e.g. SA-2025-0001" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-block mt-3">Sign In</button>
    </form>

    <p class="auth-hint">
      Default admin: <strong>SA-2025-0001</strong> / <strong>admin123</strong>
    </p>
  </div>
</div>
{% endblock %}
